<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exotic Command Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>EXOTIC</h1>
        <p>Self-Building SDK · Command Center</p>
      </div>
      <button class="status">Core Online</button>
    </header>

    <section class="dashboard">
      <aside class="panel left">
        <h2>Core Engines</h2>
        <button>Registry</button>
        <button>Reflection</button>
        <button>Manifest</button>
        <button>Graph</button>
        <button>Generator</button>
      </aside>

      <section class="canvas">
        <h2>Universal System Graph</h2>
        <div class="graph">
          <span></span><span></span><span></span>
          <span></span><strong></strong><span></span>
          <span></span><span></span><span></span>
        </div>
      </section>

      <aside class="panel right">
        <h2>Actions</h2>
        <button>🏗 Create Engine</button>
        <button>🧠 Architect</button>
        <button>🚑 Build Doctor</button>
        <button>📚 Docs</button>
        <button>🧪 Tests</button>
      </aside>
    </section>
  </main>
<nav class="dock">
  <button>⌘ Create</button>
  <button>🧠 Architect</button>
  <button>🔍 Search</button>
  <button>🧪 Test</button>
  <button>🚀 Build</button>
</nav>
  <script src="app.js"></script>
</body>
</html>
